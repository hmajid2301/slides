version: '3'

tasks:
  lint:
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm lint
      - nixfmt --check flake.nix

  build:
    cmds:
      - pnpm install --frozen-lockfile
      - node scripts/build.mjs

  pages:
    requires:
      vars: [CI_PAGES_URL]
    cmds:
      - task build
      - test -s public/index.html

  start_server:
    cmds:
      - miniserve public --index index.html --interfaces 127.0.0.1 --port 1313
